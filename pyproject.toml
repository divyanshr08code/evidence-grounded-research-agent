[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-grounded-research-agent"
version = "0.1.0"
description = "An AI research agent that grounds its answers in retrievable, citable evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Divyansh Rungta", email = "divyanshrungta8@gmail.com" },
]
dependencies = [
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
